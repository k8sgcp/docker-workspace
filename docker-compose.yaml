services:
  # 1. Backend Database
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "YourSecurePassword123!"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 2. Caching Layer
  cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 3. User Facing Go App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_web_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "YourSecurePassword123!"
      DB_NAME: "app_db"
      REDIS_HOST: "cache"
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app_network

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
