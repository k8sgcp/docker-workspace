version: '3.8'

services:
  web-server:
    image: nginx:alpine
    container_name: 3tier-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-server
    networks:
      - frontend-net

  app-server:
    build:
      context: ./java-app
      dockerfile: Dockerfile
    container_name: 3tier-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-server:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
    depends_on:
      db-server:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  db-server:
    image: postgres:15-alpine
    container_name: 3tier-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
