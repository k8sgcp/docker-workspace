version: '3.8'

services:
  # 1. Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: dev_postgres
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: main_db
    volumes:
      - db_data:/var/lib/postgresql/data # Persists data on host
    ports:
      - "5432:5432"

  # 2. Web API Service
  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev_web_api
    restart: unless-stopped
    ports:
      - "8000:8000" # Host:Container
    environment:
      - DATABASE_URL=postgresql://app_user:secretpassword@postgres_db:5432/main_db
    depends_on:
      - postgres_db # Controls startup order

# Persistent Volumes Declaration
volumes:
  db_data:
