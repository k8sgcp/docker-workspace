services:
  api:
    build: .                    # builds from the Dockerfile in this directory
    image: go-api:local
    container_name: go-api
    ports:
      - "8000:8000"              # host:container
    environment:
      DB_HOST: db                # service name = hostname on the compose network
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to be ready, not just started
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data   # named volume = persists across container restarts/removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    # Uncomment to inspect the DB from your host with a client (psql, DBeaver, etc.)
    # ports:
    #   - "5432:5432"

networks:
  backend:
    driver: bridge

volumes:
  db-data:
