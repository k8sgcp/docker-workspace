  name: .NET Outer Loop CI Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Code Formatting Check
        run: dotnet format dotnet-app/MyDotnetApp.csproj --verify-no-changes

      - name: Restore Dependencies
        run: dotnet restore dotnet-app/MyDotnetApp.csproj

      - name: Build Solution
        run: dotnet build dotnet-app/MyDotnetApp.csproj --no-restore -c Release

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build image locally into Docker daemon cache for Trivy scanning
      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: dotnet-app/
          file: dotnet-app/Dockerfile
          load: true
          tags: dotnet-app:test

      # 2. Run Trivy against the local image
      - name: Run Trivy Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dotnet-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Log in to GHCR (only runs on merge/push to main, not PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Push to GHCR with dynamic tags upon successful scan
      - name: Push Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: dotnet-app/
          file: dotnet-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
