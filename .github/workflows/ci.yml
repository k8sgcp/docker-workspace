name: .NET Outer Loop CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Code Formatting Check
        run: dotnet format dotnet-app/MyDotnetApp.csproj --verify-no-changes

      - name: Restore Dependencies
        run: dotnet restore dotnet-app/MyDotnetApp.csproj

      - name: Build Solution
        run: dotnet build dotnet-app/MyDotnetApp.csproj --no-restore -c Release

      - name: Build Multi-Stage Production Docker Image
        run: |
          docker build -t dotnet-service:prod -f dotnet-app/Dockerfile dotnet-app/

      - name: Run Trivy Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dotnet-service:prod'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
